iro + troco</text><rect fill="#e7ebef" height="54" rx="7" ry="7" stroke="#82909e" stroke-width="1.5" width="1170" x="55" y="724" /><text fill="#293544" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="640.0" y="756.0">[ FINALIZAR SIMULAÇÃO ]</text><rect fill="#e7ebef" height="66" rx="7" ry="7" stroke="#82909e" stroke-width="1.5" width="1170" x="55" y="793" /><text fill="#293544" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="640.0" y="831.0">ESTADO DE SUCESSO: resumo fictício e aviso de que não existe pedido ou pagamento real</text><rect fill="#e7ebef" height="51" rx="7" ry="7" stroke="#82909e" stroke-width="1.5" width="1170" x="55" y="873" /><text fill="#293544" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="640.0" y="903.5">RODAPÉ</text><text fill="#293544" font-family="DejaVu Sans" font-size="10" x="55" y="973">ESTADOS REPRESENTADOS DE FORMA ESQUEMÁTICA • SEM ESCALA</text></svg>